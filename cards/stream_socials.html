<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Mordraga — Social Links</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&display=swap');
    :root{--black:#080808;--deep:#0f0d0f;--surface:#141014;--border:#2a1f2a;--accent:#8b1a1a;--gold:#c9a84c;--gold-dim:#8a6e2e;--text:#d4c9d4;--text-dim:#7a6d7a}
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%;background:var(--black)}
    body{display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-weight:300;color:var(--text);padding:0.5rem}
    .card{width:100%;max-width:320px;background:var(--deep);border:1px solid var(--border);position:relative;overflow:hidden}
    .card::before,.card::after{content:'';position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--accent),var(--gold),var(--accent),transparent);z-index:2}
    .card::before{top:0}.card::after{bottom:0}
    header{text-align:center;padding:0.8rem 1rem 0.6rem;border-bottom:1px solid var(--border);background:var(--surface)}
    .sigil{font-size:1rem;color:var(--accent);letter-spacing:0.4em;margin-bottom:0.2rem}
    h1{font-family:'Cinzel Decorative',serif;font-size:1.1rem;color:var(--gold);letter-spacing:0.08em}
    .subtitle{font-size:0.6rem;color:var(--text-dim);letter-spacing:0.2em;text-transform:uppercase;font-style:italic;margin-top:0.1rem}
    footer{text-align:center;padding:0.4rem;font-size:0.6rem;color:var(--text-dim);letter-spacing:0.15em;text-transform:uppercase;background:var(--surface)}

    .social-list {
      list-style: none;
    }

    .social-item {
      display: flex;
      align-items: baseline;
      gap: 0.6rem;
      padding: 0.45rem 1rem;
      border-bottom: 1px solid #1a121a;
    }

    .social-item:last-child { border-bottom: none; }

    .platform {
      font-family: 'Cinzel Decorative', serif;
      font-size: 0.42rem;
      color: var(--text-dim);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      min-width: 54px;
      flex-shrink: 0;
    }

    .handle {
      font-size: 0.78rem;
      color: var(--gold);
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="card">
    <header>
      <div class="sigil">⸸ ✦ ⸸</div>
      <h1>Find Me</h1>
      <div class="subtitle">mordraga0</div>
    </header>

    <ul class="social-list">
      <li class="social-item">
        <span class="platform">Twitch</span>
        <span class="handle">twitch.tv/mordraga0</span>
      </li>
      <li class="social-item">
        <span class="platform">Twitter</span>
        <span class="handle">@Mordraga0</span>
      </li>
      <li class="social-item">
        <span class="platform">YouTube</span>
        <span class="handle">@mordraga0</span>
      </li>
      <li class="social-item">
        <span class="platform">Fansly</span>
        <span class="handle">fansly.com/Mordraga0</span>
      </li>
      <li class="social-item">
        <span class="platform">Discord</span>
        <span class="handle">discord.gg/HCCFcYRJjY</span>
      </li>
      <li class="social-item">
        <span class="platform">Ko-fi</span>
        <span class="handle">ko-fi.com/mordraga0</span>
      </li>
      <li class="social-item">
        <span class="platform">Throne</span>
        <span class="handle">throne.com/mordraga</span>
      </li>
    </ul>

    <footer>The Crypt · @Mordraga0 · she/they</footer>
  </div>
</body>
</html>
