<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mordraga — OG Banner</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&display=swap');

    :root {
      --black:    #080808;
      --deep:     #0f0d0f;
      --surface:  #141014;
      --border:   #2a1f2a;
      --accent:   #8b1a1a;
      --accent-dim: #5c1212;
      --gold:     #c9a84c;
      --gold-dim: #8a6e2e;
      --text:     #d4c9d4;
      --text-dim: #7a6d7a;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { background: var(--black); }

    /* Link-preview image (og:image): 1200x630. Render at exactly this size.
       Previews are often shown ~500px wide, so text is kept large. */
    .banner {
      width: 1200px;
      height: 630px;
      position: relative;
      overflow: hidden;
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      color: var(--text);
      background:
        radial-gradient(ellipse 50% 55% at 50% 42%, rgba(139, 26, 26, 0.20), transparent 70%),
        radial-gradient(ellipse 90% 90% at 50% 50%, var(--deep), var(--black) 85%);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .circle {
      position: absolute;
      left: 50%; top: 50%;
      width: 760px; height: 760px;
      transform: translate(-50%, -50%);
      opacity: 0.08;
    }

    /* the card, scaled up */
    .card {
      position: relative;
      width: 1040px;
      background: rgba(15, 13, 15, 0.88);
      border: 1px solid var(--border);
    }
    .card::before,
    .card::after {
      content: '';
      position: absolute;
      left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--accent), var(--gold), var(--accent), transparent);
    }
    .card::before { top: 0; }
    .card::after  { bottom: 0; }

    header {
      text-align: center;
      padding: 34px 40px 28px;
      border-bottom: 1px solid var(--border);
      background: rgba(20, 16, 20, 0.9);
    }

    .sigil {
      font-size: 30px;
      color: var(--accent);
      letter-spacing: 0.4em;
      padding-left: 0.4em;
      margin-bottom: 8px;
    }

    h1 {
      font-family: 'Cinzel Decorative', serif;
      font-weight: 700;
      font-size: 104px;
      line-height: 1;
      color: var(--gold);
      letter-spacing: 0.06em;
      padding-left: 0.06em;
      text-shadow: 0 0 32px rgba(201, 168, 76, 0.25), 0 3px 0 rgba(0, 0, 0, 0.6);
    }

    .subtitle {
      font-size: 30px;
      color: var(--text-dim);
      letter-spacing: 0.28em;
      padding-left: 0.28em;
      text-transform: uppercase;
      font-style: italic;
      margin-top: 14px;
    }

    /* three pillars, styled like the cards' platform/handle rows */
    .pillars {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
    }
    .pillar {
      text-align: center;
      padding: 24px 16px 26px;
    }
    .pillar + .pillar { border-left: 1px solid var(--border); }

    .label {
      font-family: 'Cinzel Decorative', serif;
      font-size: 17px;
      color: var(--text-dim);
      letter-spacing: 0.25em;
      padding-left: 0.25em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .value {
      font-size: 32px;
      color: var(--gold);
      font-style: italic;
      font-weight: 400;
      font-variant-numeric: lining-nums;
    }

    footer {
      text-align: center;
      padding: 14px;
      font-size: 22px;
      color: var(--accent);
      letter-spacing: 0.18em;
      padding-left: calc(14px + 0.18em);
      font-style: italic;
      border-top: 1px solid var(--border);
      background: rgba(20, 16, 20, 0.9);
      font-variant-numeric: lining-nums;
    }
    footer span { color: var(--gold-dim); font-style: normal; margin: 0 0.5em; }
  </style>
</head>
<body>
  <div class="banner">
    <svg class="circle" viewBox="0 0 100 100" aria-hidden="true">
      <g fill="none" stroke="#c9a84c" stroke-width="0.35">
        <circle cx="50" cy="50" r="48"/>
        <circle cx="50" cy="50" r="44"/>
        <polygon points="50,6 75.9,85.6 8.2,36.4 91.8,36.4 24.1,85.6"/>
      </g>
    </svg>

    <div class="card">
      <header>
        <div class="sigil">⸸ ✦ ⸸</div>
        <h1>Mordraga</h1>
        <div class="subtitle">Chaos · Witchiness · Feral</div>
      </header>

      <div class="pillars">
        <div class="pillar">
          <div class="label">VTuber</div>
          <div class="value">twitch.tv/mordraga0</div>
        </div>
        <div class="pillar">
          <div class="label">Witch</div>
          <div class="value">lore from the crypt</div>
        </div>
        <div class="pillar">
          <div class="label">Developer</div>
          <div class="value">tools, bots &amp; sites</div>
        </div>
      </div>

      <footer>mordraga.me<span>✦</span>@Mordraga0<span>✦</span>she/they</footer>
    </div>
  </div>
</body>
</html>
