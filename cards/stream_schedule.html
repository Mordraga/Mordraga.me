<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Mordraga — Schedule</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&display=swap');
    :root{--black:#080808;--deep:#0f0d0f;--surface:#141014;--border:#2a1f2a;--accent:#8b1a1a;--gold:#c9a84c;--gold-dim:#8a6e2e;--text:#d4c9d4;--text-dim:#7a6d7a;--yes-text:#7fc97f}
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%;background:var(--black)}
    body{display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-weight:300;color:var(--text);padding:0.5rem}
    .card{width:100%;max-width:320px;background:var(--deep);border:1px solid var(--border);position:relative;overflow:hidden}
    .card::before,.card::after{content:'';position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--accent),var(--gold),var(--accent),transparent);z-index:2}
    .card::before{top:0}.card::after{bottom:0}
    header{text-align:center;padding:0.8rem 1rem 0.6rem;border-bottom:1px solid var(--border);background:var(--surface);position:relative}
    .sigil{font-size:1rem;color:var(--accent);letter-spacing:0.4em;margin-bottom:0.2rem}
    h1{font-family:'Cinzel Decorative',serif;font-size:1.1rem;color:var(--gold);letter-spacing:0.08em}
    .subtitle{font-size:0.6rem;color:var(--text-dim);letter-spacing:0.2em;text-transform:uppercase;font-style:italic;margin-top:0.1rem}
    .week-of{font-size:0.62rem;color:var(--accent);letter-spacing:0.08em;font-style:italic;margin-top:0.25rem}
    footer{text-align:center;padding:0.4rem;font-size:0.6rem;color:var(--text-dim);letter-spacing:0.15em;text-transform:uppercase;background:var(--surface)}

    /* small model-art accent, corner of the header — subtle, not a focal point */
    .model-accent {
      position: absolute;
      top: 0.6rem;
      right: 0.7rem;
      width: 36px;
      height: 36px;
      border: 1px solid var(--gold-dim);
      border-radius: 50%;
      object-fit: cover;
      background: var(--deep);
    }

    .sched-body {
      padding: 1.2rem 1rem 1.2rem;
      border-bottom: 1px solid var(--border);
    }

    .day-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.6rem;
      padding: 0.5rem 0.2rem;
    }

    .day-row + .day-row {
      border-top: 1px solid var(--border);
    }

    .day-info {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.2rem;
    }

    .day {
      font-family: 'Cinzel Decorative', serif;
      font-size: 0.6rem;
      letter-spacing: 0.15em;
      color: var(--gold);
      border: 1px solid var(--gold-dim);
      padding: 0.25rem 0.55rem;
      background: var(--surface);
    }

    .topic {
      font-size: 0.72rem;
      color: var(--text);
      font-style: italic;
      padding-left: 0.1rem;
    }

    .time {
      font-size: 0.85rem;
      color: var(--text-dim);
      font-style: italic;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }

    /* click-to-edit fields — content lives in localStorage, not source */
    [contenteditable="true"] {
      cursor: text;
      outline: none;
      border-bottom: 1px dotted var(--border);
    }
    [contenteditable="true"]:hover  { border-bottom-color: var(--gold-dim); }
    [contenteditable="true"]:focus  { border-bottom-color: var(--gold); }

    /* stream status badge — same tag treatment as the tools page's .tool-status */
    .status-col {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.3rem;
    }

    .sched-status {
      font-family: 'Cinzel Decorative', serif;
      font-size: 0.45rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 0.15rem 0.5rem;
      border: 1px solid;
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
      background: none;
      -webkit-tap-highlight-color: transparent;
    }

    .sched-status:hover { filter: brightness(1.3); }

    .status-live     { color: var(--yes-text); border-color: var(--yes-text); }
    .status-not-live { color: var(--text-dim); border-color: var(--border); }

    .tz {
      font-size: 0.58rem;
      color: var(--text-dim);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      text-align: center;
      margin-top: 0.7rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <header>
      <img class="model-accent" src="assets/images/MordragaRockHeart.png" alt="" onerror="this.style.display='none'">
      <div class="sigil">⸸ ✦ ⸸</div>
      <h1>Schedule</h1>
      <div class="subtitle">mordraga0</div>
      <div class="week-of" id="week-of">Week of —</div>
    </header>

    <!-- EDIT WEEKLY: day names below are structural (they key localStorage — don't rename lightly).
         Topic and time are click-to-edit in the browser and persist via localStorage; the "TBD"
         here is just the fallback shown before you've ever set a value on this browser.
         Click a row's status badge to toggle Manifest/Veiled while a stream is actually running.
         Re-export via card_downloader.html whenever you're ready to post. -->
    <div class="sched-body">
      <div class="day-row">
        <div class="day-info">
          <span class="day">Sunday</span>
          <span class="topic" contenteditable="true" data-key="sunday-topic">TBD</span>
        </div>
        <div class="status-col">
          <span class="sched-status status-not-live">Veiled</span>
          <span class="time" contenteditable="true" data-key="sunday-time">TBD</span>
        </div>
      </div>
      <div class="day-row">
        <div class="day-info">
          <span class="day">Monday</span>
          <span class="topic" contenteditable="true" data-key="tuesday-topic">TBD</span>
        </div>
        <div class="status-col">
          <span class="sched-status status-not-live">Veiled</span>
          <span class="time" contenteditable="true" data-key="tuesday-time">TBD</span>
        </div>
      </div>
      <div class="day-row">
        <div class="day-info">
          <span class="day">Tuesday</span>
          <span class="topic" contenteditable="true" data-key="monday-topic">TBD</span>
        </div>
        <div class="status-col">
          <span class="sched-status status-not-live">Veiled</span>
          <span class="time" contenteditable="true" data-key="monday-time">TBD</span>
        </div>
      </div>
      <div class="day-row">
        <div class="day-info">
          <span class="day">Wednesday</span>
          <span class="topic" contenteditable="true" data-key="wednesday-topic">TBD</span>
        </div>
        <div class="status-col">
          <span class="sched-status status-not-live">Veiled</span>
          <span class="time" contenteditable="true" data-key="wednesday-time">TBD</span>
        </div>
      </div>
      <div class="day-row">
        <div class="day-info">
          <span class="day">Thursday</span>
          <span class="topic" contenteditable="true" data-key="thursday-topic">TBD</span>
        </div>
        <div class="status-col">
          <span class="sched-status status-not-live">Veiled</span>
          <span class="time" contenteditable="true" data-key="thursday-time">TBD</span>
        </div>
      </div>
      <div class="day-row">
        <div class="day-info">
          <span class="day">Friday</span>
          <span class="topic" contenteditable="true" data-key="friday-topic">TBD</span>
        </div>
        <div class="status-col">
          <span class="sched-status status-not-live">Veiled</span>
          <span class="time" contenteditable="true" data-key="friday-time">TBD</span>
        </div>
      </div>
      <div class="day-row">
        <div class="day-info">
          <span class="day">Saturday</span>
          <span class="topic" contenteditable="true" data-key="saturday-topic">TBD</span>
        </div>
        <div class="status-col">
          <span class="sched-status status-not-live">Veiled</span>
          <span class="time" contenteditable="true" data-key="saturday-time">TBD</span>
        </div>
      </div>
      <div class="tz">Eastern Standard Time</div>
    </div>

    <footer>The Crypt · @Mordraga0 · she/they</footer>
  </div>

  <script>
    // Sunday of the current week (or today, if today is Sunday)
    var today = new Date();
    var daysUntilSunday = (7 - today.getDay()) % 7;
    var sunday = new Date(today);
    sunday.setDate(today.getDate() + daysUntilSunday);
    document.getElementById('week-of').textContent =
      'Week of ' + sunday.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });

    // Click a status badge to toggle Manifest/Veiled
    document.querySelectorAll('.sched-status').forEach(function (badge) {
      badge.addEventListener('click', function () {
        var live = badge.classList.toggle('status-live');
        badge.classList.toggle('status-not-live', !live);
        badge.textContent = live ? 'Manifest' : 'Veiled';
      });
    });

    // Click-to-edit topic/time fields, persisted per-browser via localStorage
    document.querySelectorAll('[data-key]').forEach(function (el) {
      var storageKey = 'sched_' + el.dataset.key;
      var saved = localStorage.getItem(storageKey);
      if (saved !== null) el.textContent = saved;

      el.addEventListener('blur', function () {
        localStorage.setItem(storageKey, el.textContent.trim());
      });

      el.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); el.blur(); }
      });
    });
  </script>
</body>
</html>
