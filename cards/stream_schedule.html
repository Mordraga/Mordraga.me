<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Mordraga — Schedule</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&display=swap');
    :root{--black:#080808;--deep:#0f0d0f;--surface:#141014;--border:#2a1f2a;--accent:#8b1a1a;--gold:#c9a84c;--gold-dim:#8a6e2e;--text:#d4c9d4;--text-dim:#7a6d7a}
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%;background:var(--black)}
    body{display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-weight:300;color:var(--text);padding:0.5rem}
    .card{width:100%;max-width:320px;background:var(--deep);border:1px solid var(--border);position:relative;overflow:hidden}
    .card::before,.card::after{content:'';position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--accent),var(--gold),var(--accent),transparent);z-index:2}
    .card::before{top:0}.card::after{bottom:0}
    header{text-align:center;padding:0.8rem 1rem 0.6rem;border-bottom:1px solid var(--border);background:var(--surface);position:relative}
    .sigil{font-size:1rem;color:var(--accent);letter-spacing:0.4em;margin-bottom:0.2rem}
    h1{font-family:'Cinzel Decorative',serif;font-size:1.1rem;color:var(--gold);letter-spacing:0.08em}
    .subtitle{font-size:0.6rem;color:var(--text-dim);letter-spacing:0.2em;text-transform:uppercase;font-style:italic;margin-top:0.1rem}
    .week-of{font-size:0.62rem;color:var(--accent);letter-spacing:0.08em;font-style:italic;margin-top:0.25rem}
    footer{text-align:center;padding:0.4rem;font-size:0.6rem;color:var(--text-dim);letter-spacing:0.15em;text-transform:uppercase;background:var(--surface)}

    /* small model-art accent, corner of the header — subtle, not a focal point */
    .model-accent {
      position: absolute;
      top: 0.6rem;
      right: 0.7rem;
      width: 36px;
      height: 36px;
      border: 1px solid var(--gold-dim);
      border-radius: 50%;
      object-fit: cover;
      background: var(--deep);
    }

    .sched-body {
      padding: 1.2rem 1rem 1.2rem;
      border-bottom: 1px solid var(--border);
    }

    .day-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.6rem;
      padding: 0.5rem 0.2rem;
    }

    .day-row + .day-row {
      border-top: 1px solid var(--border);
    }

    .day-info {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.2rem;
    }

    .day {
      font-family: 'Cinzel Decorative', serif;
      font-size: 0.6rem;
      letter-spacing: 0.15em;
      color: var(--gold);
      border: 1px solid var(--gold-dim);
      padding: 0.25rem 0.55rem;
      background: var(--surface);
    }

    .topic {
      font-size: 0.72rem;
      color: var(--text);
      font-style: italic;
      padding-left: 0.1rem;
    }

    .time {
      font-size: 0.85rem;
      color: var(--text-dim);
      font-style: italic;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }

    .tz {
      font-size: 0.58rem;
      color: var(--text-dim);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      text-align: center;
      margin-top: 0.7rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <header>
      <img class="model-accent" src="assets/images/MordragaRockHeart.png" alt="" onerror="this.style.display='none'">
      <div class="sigil">⸸ ✦ ⸸</div>
      <h1>Schedule</h1>
      <div class="subtitle">mordraga0</div>
      <div class="week-of" id="week-of">Week of —</div>
    </header>

    <!-- EDIT WEEKLY: update day/time/topic below every Sunday, then re-export via card_downloader.html -->
    <div class="sched-body">
      <div class="day-row">
        <div class="day-info">
          <span class="day">Sunday</span>
          <span class="topic">Cozy Games</span>
        </div>
        <span class="time">4:00 PM — 8:00 PM</span>
      </div>
      <div class="day-row">
        <div class="day-info">
          <span class="day">Monday</span>
          <span class="topic">Just Chatting</span>
        </div>
        <span class="time">4:00 PM — 8:00 PM</span>
      </div>
      <div class="day-row">
        <div class="day-info">
          <span class="day">Thursday</span>
          <span class="topic">Horror Night</span>
        </div>
        <span class="time">4:00 PM — 8:00 PM</span>
      </div>
      <div class="tz">Eastern Standard Time</div>
    </div>

    <footer>The Crypt · @Mordraga0 · she/they</footer>
  </div>

  <script>
    // Sunday of the current week (or today, if today is Sunday)
    var today = new Date();
    var daysUntilSunday = (7 - today.getDay()) % 7;
    var sunday = new Date(today);
    sunday.setDate(today.getDate() + daysUntilSunday);
    document.getElementById('week-of').textContent =
      'Week of ' + sunday.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  </script>
</body>
</html>
